<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandroka Vola - Studio Edition</title>
    <style>
        :root { --aviator: #d32f2f; --cosmos: #f39c12; --bg: #f0f2f5; --card: #ffffff; --input-bg: #e8eaed; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; display: flex; justify-content: center; overflow-x: hidden; }
        .app { width: 100%; max-width: 450px; min-height: 100vh; padding-bottom: 90px; position: relative; }

        /* HEADER & TOP NAV */
        .top-nav { background: white; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 100; }
        .user-info { display: flex; align-items: center; gap: 5px; font-size: 0.8rem; font-weight: bold; color: #2c3e50; }
        .top-icons { display: flex; gap: 5px; }
        .icon-btn { background: #eee; border: none; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 1rem; }
        .btn-logout { border: 1px solid var(--aviator); color: var(--aviator); background: white; padding: 5px 8px; border-radius: 8px; font-size: 0.65rem; font-weight: bold; cursor: pointer; }

        /* TABS */
        .tabs { display: flex; background: white; padding: 10px; gap: 10px; }
        .tab { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; background: #eee; font-size: 0.85rem; }
        .tab.active-aviator { background: var(--aviator); color: white; }
        .tab.active-cosmos { background: var(--cosmos); color: white; }

        /* FORM CARDS */
        .container { padding: 15px; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; margin-bottom: 20px; }
        .field { text-align: left; margin-bottom: 15px; position: relative; }
        .label { font-size: 0.7rem; font-weight: bold; color: #888; margin-bottom: 5px; display: block; text-transform: uppercase; }
        
        /* Input miaraka amin'ny ":" */
        .input-wrapper { display: flex; align-items: center; background: var(--input-bg); border-radius: 12px; padding: 0 15px; }
        .input { width: 100%; padding: 15px 5px; border: none; background: transparent; font-size: 1.2rem; font-family: monospace; text-align: center; outline: none; }
        .separator { font-weight: bold; font-size: 1.2rem; color: #555; }

        .btn-calc { width: 100%; padding: 18px; border-radius: 15px; border: none; color: white; font-weight: 900; font-size: 1.1rem; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-aviator { background: linear-gradient(to right, #b71c1c, #d32f2f); }
        .btn-cosmos { background: linear-gradient(to right, #d32f2f, #27ae60); }

        /* RESULTS (Naverina ho hita daholo ny tour sy ny lera) */
        .res-list { display: flex; flex-direction: column; gap: 15px; }
        .res-card { background: white; border-radius: 20px; padding: 20px; border-top: 5px solid; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .res-status { font-weight: 900; font-size: 1.2rem; margin-bottom: 10px; }
        .res-time { font-size: 2.3rem; font-weight: 900; color: #27ae60; margin: 5px 0; font-family: monospace; }
        
        .tour-info { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .tour-box { background: #f8f9fa; padding: 8px 15px; border-radius: 10px; border: 1px solid #eee; font-weight: bold; color: #27ae60; font-family: monospace; }
        
        .grid-gain { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .box-gain { background: #f8f9fa; padding: 12px; border-radius: 12px; border: 1px solid #eee; }
        .g-val { font-size: 1.2rem; font-weight: 900; }

        /* FLOATING CLOCK */
        .f-clock { position: fixed; top: 70px; right: 20px; background: rgba(0,0,0,0.8); color: white; padding: 8px 12px; border-radius: 10px; font-family: monospace; font-weight: bold; z-index: 1000; border: 1px solid #444; }

        /* NAVIGATION BOTTOM */
        nav { position: fixed; bottom: 0; width: 100%; max-width: 450px; background: white; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #ddd; z-index: 100; }

        /* PAGES */
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>

<div class="app">
    <div class="f-clock" id="live-clock">00:00:00</div>

    <div class="top-nav">
        <div class="user-info">👤 Boss Bet</div>
        <div class="top-icons">
            <button class="icon-btn" onclick="alert('Maody alina mavitrika')">🌙</button>
            <button class="icon-btn" onclick="showPage('home')">🏠</button>
            <button class="icon-btn" onclick="showPage('history')">📜</button>
            <button class="icon-btn" onclick="alert('Admin Panel')">⚙️</button>
            <button class="btn-logout" onclick="alert('Mivoaka...')">Deconnexion</button>
        </div>
    </div>

    <div id="home-page" class="page active">
        <div class="tabs">
            <button id="tab-av" class="tab active-aviator" onclick="switchMode('aviator')">✈️ AVIATOR</button>
            <button id="tab-co" class="tab" onclick="switchMode('cosmos')">🚀 COSMOS X</button>
        </div>

        <div class="container">
            <div id="v-aviator" class="card">
                <div style="color:var(--aviator); font-weight:900; margin-bottom:15px;">AVIATOR STUDIO</div>
                <div class="field">
                    <span class="label">🕒 Heure du départ</span>
                    <div class="input-wrapper">
                        <input type="number" id="av-h" class="input" placeholder="HH" oninput="limit(this,2)">
                        <span class="separator">:</span>
                        <input type="number" id="av-m" class="input" placeholder="MM" oninput="limit(this,2)">
                    </div>
                </div>
                <div class="field">
                    <span class="label">🎯 Multiplicateur Cible (+2.00)</span>
                    <div class="input-wrapper"><input type="number" id="av-c" class="input" placeholder="2.00"></div>
                </div>
                <button class="btn-calc btn-aviator" onclick="calculate('aviator')">Calculer Analytics</button>
            </div>

            <div id="v-cosmos" class="card" style="display:none;">
                <div style="color:var(--cosmos); font-weight:900; margin-bottom:15px;">COSMOSX STUDIO</div>
                <div class="field">
                    <span class="label">🎰 Tour (6 chiffres)</span>
                    <div class="input-wrapper"><input type="number" id="co-tr" class="input" placeholder="063291" oninput="limit(this,6)"></div>
                </div>
                <div class="field">
                    <span class="label">🕒 Heure Exacte</span>
                    <div class="input-wrapper">
                        <input type="number" id="co-h" class="input" placeholder="HH" oninput="limit(this,2)">
                        <span class="separator">:</span>
                        <input type="number" id="co-m" class="input" placeholder="MM" oninput="limit(this,2)">
                    </div>
                </div>
                <button class="btn-calc btn-cosmos" onclick="calculate('cosmos')">Prédiction Cosmos X</button>
            </div>

            <div id="res-list" class="res-list"></div>
        </div>
    </div>

    <div id="history-page" class="page">
        <div class="container">
            <h2 style="text-align:center">📜 Historique</h2>
            <div id="hist-list" class="res-list"></div>
            <button class="btn-calc" style="background:#444" onclick="showPage('home')">Hiverina</button>
        </div>
    </div>

    <nav>
        <button class="icon-btn" onclick="showPage('home')">🏠</button>
        <button class="icon-btn" onclick="calculate(currentMode)">🎯</button>
        <button class="icon-btn" onclick="showPage('history')">📜</button>
    </nav>
</div>

<script>
    let currentMode = 'aviator';
    let historyData = [];

    setInterval(() => {
        document.getElementById('live-clock').innerText = new Date().toTimeString().split(' ')[0];
    }, 1000);

    function limit(el, max) { if(el.value.length > max) el.value = el.value.slice(0,max); }

    function switchMode(m) {
        currentMode = m;
        document.getElementById('v-aviator').style.display = m === 'aviator' ? 'block' : 'none';
        document.getElementById('v-cosmos').style.display = m === 'cosmos' ? 'block' : 'none';
        document.getElementById('tab-av').className = m === 'aviator' ? 'tab active-aviator' : 'tab';
        document.getElementById('tab-co').className = m === 'cosmos' ? 'tab active-cosmos' : 'tab';
        document.getElementById('res-list').innerHTML = "";
    }

    function showPage(p) {
        document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
        document.getElementById(p + '-page').classList.add('active');
        if(p === 'history') renderHistory();
    }

    function calculate(type) {
        const list = document.getElementById('res-list');
        list.innerHTML = ""; 
        
        for(let i=0; i<3; i++) {
            const rand = Math.random();
            const d = new Date();
            d.setMinutes(d.getMinutes() + (i * 5) + Math.floor(rand*3));
            const timeStr = d.getHours().toString().padStart(2,'0')+":"+d.getMinutes().toString().padStart(2,'0')+":"+Math.floor(rand*60).toString().padStart(2,'0');
            
            const tourBase = type === 'cosmos' ? (parseInt(document.getElementById('co-tr').value) || 63300) : (Math.floor(10000 + rand*90000));
            const tour1 = tourBase + (i*2);
            const tour2 = tour1 + 1;

            const html = `
                <div class="res-card" style="border-top-color: ${type==='aviator'?'#d32f2f':'#f39c12'}">
                    <div class="res-status" style="color:${rand>0.2?'#27ae60':'#d32f2f'}">${rand>0.2?(type==='aviator'?'TOUR TSARA ✈️':'TOUR TSARA 🚀'):'TOUR RATSY 💔'}</div>
                    <div style="font-size:0.7rem; color:#888; font-weight:bold;">🕒 HEURE PRÉDITE</div>
                    <div class="res-time">${timeStr}</div>
                    <div class="tour-info">
                        <div class="tour-box">🎰 ${tour1}</div>
                        <div class="tour-box">🎰 ${tour2}</div>
                    </div>
                    <div class="grid-gain">
                        <div class="box-gain"><span class="label">Petit Gain</span><span class="g-val" style="color:#27ae60">x${(1.5 + rand*3).toFixed(2)}</span></div>
                        <div class="box-gain"><span class="label">Gros Gain</span><span class="g-val" style="color:#d32f2f">x${(10 + rand*40).toFixed(2)}</span></div>
                    </div>
                </div>`;
            list.innerHTML += html;
            historyData.unshift(html);
        }
    }

    function renderHistory() {
        document.getElementById('hist-list').innerHTML = historyData.slice(0,10).join('') || "<p style='text-align:center'>Tsy mbola misy tantara.</p>";
    }
</script>
</body>
</html>
