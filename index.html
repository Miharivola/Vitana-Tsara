<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandroka Vola - Update Aviator</title>
    <style>
        :root { 
            --bg: #f2f2f2; --card: #ffffff; --text: #2c3e50; --input-bg: #e8eaed;
            --aviator: #d32f2f; --cosmos: #f39c12; --green: #27ae60; --border: #ddd;
        }
        body.dark-mode { 
            --bg: #121212; --card: #1e1e1e; --text: #ffffff; --input-bg: #2d2d2d; --border: #444;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; transition: 0.3s; }
        .app { width: 100%; max-width: 450px; min-height: 100vh; position: relative; padding-bottom: 90px; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: var(--card); border-bottom: 1px solid var(--border); }
        .nav-icons { display: flex; gap: 8px; }
        .n-btn { background: var(--input-bg); border: none; padding: 8px; border-radius: 50%; cursor: pointer; color: var(--text); width: 35px; height: 35px; }

        .tabs { display: flex; padding: 10px 15px; gap: 10px; }
        .tab { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 900; cursor: pointer; background: var(--input-bg); color: #777; }
        .tab.active-av { background: var(--card); border: 1px solid var(--border); color: var(--aviator); }
        .tab.active-co { background: var(--cosmos); color: white; }

        .container { padding: 15px; }
        .studio-card { background: var(--card); border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; border: 1px solid var(--border); }
        .f-label { display: block; text-align: left; font-size: 0.7rem; font-weight: 800; color: #999; margin-bottom: 8px; text-transform: uppercase; }
        .f-input-wrap { background: var(--input-bg); border-radius: 15px; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border); }
        .f-input { width: 100%; border: none; background: transparent; font-size: 1.3rem; font-family: monospace; text-align: center; outline: none; font-weight: bold; color: var(--green); }

        .btn-main { width: 100%; padding: 18px; border-radius: 15px; border: none; color: white; font-weight: 900; font-size: 1rem; cursor: pointer; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-av { background: linear-gradient(to right, #d32f2f, #27ae60); }
        .btn-co { background: linear-gradient(to right, #d32f2f, #27ae60); }

        /* VOKATRA AVIATOR VAOVAO (Sary 12) */
        .res-box { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid var(--border); display: none; margin-top: 20px; }
        .res-title { font-size: 0.7rem; color: #888; font-weight: 800; text-transform: uppercase; display: block; margin-bottom: 10px; }
        .h-predites-list { list-style: none; padding: 0; margin: 10px 0; }
        .h-predites-list li { font-size: 1.6rem; font-weight: 900; color: var(--green); font-family: monospace; margin: 5px 0; }
        .h-predites-list li span { color: #888; font-size: 1.2rem; margin-right: 10px; }

        .gain-row { display: flex; align-items: center; justify-content: space-between; background: var(--input-bg); padding: 15px; border-radius: 15px; margin-bottom: 8px; border: 1px solid var(--border); }
        .gain-label { font-size: 0.65rem; font-weight: 800; color: #777; text-align: left; flex: 1; margin-left: 10px; }
        .gain-val { font-size: 1.2rem; font-weight: 900; font-family: monospace; }

        /* FLOATING CLOCK */
        .f-clock { position: fixed; top: 180px; left: 15px; background: rgba(0,0,0,0.8); color: #fff; padding: 8px 12px; border-radius: 10px; font-family: monospace; font-weight: bold; z-index: 1000; }

        nav { position: fixed; bottom: 0; width: 100%; max-width: 450px; background: var(--card); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

<div class="app">
    <div class="f-clock" id="live-clock">00:00:00</div>

    <div class="header">
        <div style="font-weight:bold">👤 Boss Bet</div>
        <div class="nav-icons">
            <button class="n-btn" onclick="document.body.classList.toggle('dark-mode')">🌙</button>
            <button class="n-btn">🏠</button>
            <button class="n-btn">📜</button>
            <button class="n-btn">⚙️</button>
        </div>
    </div>

    <div class="tabs">
        <button id="tab-av" class="tab active-av" onclick="switchMode('aviator')">✈️ AVIATOR</button>
        <button id="tab-co" class="tab" onclick="switchMode('cosmos')">🚀 COSMOS X</button>
    </div>

    <div class="container">
        <div id="form-aviator" class="studio-card">
            <div style="color:var(--aviator); font-weight:900; margin-bottom:20px;">✈️ VERT RAIKA ⭐</div>
            <div class="f-label">🕒 HEURE DU DÉPART</div>
            <div class="f-input-wrap"><input type="text" id="av-h" class="f-input" placeholder="00 : 00 : 00"></div>
            <div class="f-label">🎯 MULTIPLICATEUR CIBLE (+2.00)</div>
            <div class="f-input-wrap"><input type="number" id="av-c" class="f-input" value="2.7"></div>
            <button class="btn-main btn-av" onclick="calculateAviator()">🔮 CALCULER</button>
        </div>

        <div id="form-cosmos" class="studio-card" style="display:none">
            <div style="color:var(--cosmos); font-weight:900; margin-bottom:20px;">🚀 COSMOS X ⭐</div>
            <div class="f-label">🎰 TOUR (6 CHIFFRES)</div>
            <div class="f-input-wrap"><input type="number" id="co-tr" class="f-input" value="063291"></div>
            <button class="btn-main btn-co">🚀 PRÉDICTION COSMOS X</button>
        </div>

        <div id="res-aviator" class="res-box">
            <span class="res-title">🖐️ HEURES PRÉDITES</span>
            <ul class="h-predites-list">
                <li><span>1.</span> <span id="h1">03:20:10</span></li>
                <li><span>2.</span> <span id="h2">03:22:41</span></li>
                <li><span>3.</span> <span id="h3">03:23:15</span></li>
            </ul>

            <div class="gain-row">
                <span>👑</span>
                <span class="gain-label">SÉCURITÉ DES MISES</span>
                <b class="gain-val" style="color:var(--green)" id="av-g1">x3.55</b>
            </div>
            <div class="gain-row">
                <span>💸</span>
                <span class="gain-label">AFAKA TENTENA TSARA @2EM MISE</span>
                <b class="gain-val" style="color:var(--aviator)" id="av-g2">x5.19</b>
            </div>
            <div class="gain-row">
                <span>💰</span>
                <span class="gain-label">TENTEO RAHA EFA MBA GAIN ANAO</span>
                <b class="gain-val" style="color:var(--green)" id="av-g3">x156.92</b>
            </div>
        </div>
    </div>

    <nav>
        <button class="n-btn">🏠</button>
        <button class="n-btn" style="color:var(--aviator)">🎯</button>
        <button class="n-btn">📜</button>
    </nav>
</div>

<script>
    setInterval(() => {
        document.getElementById('live-clock').innerText = new Date().toTimeString().split(' ')[0];
    }, 1000);

    function switchMode(m) {
        document.getElementById('form-aviator').style.display = m === 'aviator' ? 'block' : 'none';
        document.getElementById('form-cosmos').style.display = m === 'cosmos' ? 'block' : 'none';
        document.getElementById('tab-av').className = m === 'aviator' ? 'tab active-av' : 'tab';
        document.getElementById('tab-co').className = m === 'cosmos' ? 'tab active-co' : 'tab';
        document.getElementById('res-aviator').style.display = 'none';
    }

    function calculateAviator() {
        document.getElementById('res-aviator').style.display = 'block';
        const now = new Date();
        
        // Famoronana lera 3 samy hafa
        const t1 = new Date(now.getTime() + 2*60000);
        const t2 = new Date(now.getTime() + 4*60000);
        const t3 = new Date(now.getTime() + 5*60000);

        document.getElementById('h1').innerText = t1.toTimeString().split(' ')[0];
        document.getElementById('h2').innerText = t2.toTimeString().split(' ')[0];
        document.getElementById('h3').innerText = t3.toTimeString().split(' ')[0];

        // Gain kisendrasendra ohatra ny amin'ny sary
        document.getElementById('av-g1').innerText = "x" + (2 + Math.random()*2).toFixed(2);
        document.getElementById('av-g2').innerText = "x" + (5 + Math.random()*5).toFixed(2);
        document.getElementById('av-g3').innerText = "x" + (100 + Math.random()*100).toFixed(2);
        
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>
</body>
</html>
