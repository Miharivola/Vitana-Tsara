<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandroka Vola - Studio Professional</title>
    <style>
        :root { --aviator: #d32f2f; --cosmos: #f39c12; --bg: #f4f6f9; --card: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; display: flex; justify-content: center; }
        .app { width: 100%; max-width: 450px; min-height: 100vh; padding-bottom: 90px; }

        /* TOP NAV */
        .top-nav { background: white; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 100; }
        .user-info { font-weight: bold; font-size: 0.85rem; }
        .top-icons { display: flex; gap: 10px; }
        .icon-btn { background: #eee; border: none; padding: 10px; border-radius: 10px; cursor: pointer; }

        /* TABS */
        .tabs { display: flex; background: white; padding: 10px; gap: 10px; border-bottom: 1px solid #eee; }
        .tab { flex: 1; padding: 15px; border-radius: 12px; border: none; font-weight: 900; cursor: pointer; background: #eee; color: #666; transition: 0.3s; }
        .tab.active-av { background: var(--aviator); color: white; }
        .tab.active-co { background: var(--cosmos); color: white; }

        /* CONTAINER & CARDS */
        .container { padding: 15px; }
        .card { background: white; border-radius: 25px; padding: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-bottom: 20px; text-align: center; }
        .field { text-align: left; margin-bottom: 18px; }
        .label { font-size: 0.75rem; font-weight: 800; color: #999; margin-bottom: 8px; display: block; text-transform: uppercase; }
        
        .input-group { display: flex; align-items: center; background: #f0f2f5; border-radius: 15px; padding: 5px 15px; border: 1px solid #e0e0e0; }
        .input-group input { width: 100%; border: none; background: transparent; padding: 12px; font-size: 1.3rem; font-family: monospace; text-align: center; outline: none; }
        .sep { font-weight: bold; font-size: 1.3rem; color: #888; }

        .btn-calc { width: 100%; padding: 20px; border-radius: 18px; border: none; color: white; font-weight: 900; font-size: 1.1rem; cursor: pointer; text-transform: uppercase; }

        /* RESULTATS SAMY HAFA */
        .res-box { display: none; margin-top: 15px; text-align: left; }
        .res-item { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; border-left: 10px solid; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .res-time { font-size: 2.2rem; font-weight: 900; color: #27ae60; font-family: monospace; display: block; margin: 5px 0; }
        .tour-line { display: flex; gap: 8px; margin-bottom: 10px; }
        .tour-badge { background: #e8f5e9; color: #27ae60; padding: 5px 12px; border-radius: 8px; font-weight: 900; font-family: monospace; font-size: 0.9rem; border: 1px solid #c8e6c9; }
        
        .gain-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
        .gain-card { background: #f8f9fa; padding: 12px; border-radius: 12px; border: 1px solid #eee; }
        .gain-card span { display: block; font-size: 0.65rem; font-weight: bold; color: #999; text-transform: uppercase; }
        .gain-card b { font-size: 1.2rem; font-weight: 900; }

        /* FLOATING CLOCK */
        .f-clock { position: fixed; top: 75px; right: 20px; background: rgba(0,0,0,0.85); color: white; padding: 8px 15px; border-radius: 12px; font-family: monospace; font-weight: bold; z-index: 1000; border: 1px solid #444; }

        nav { position: fixed; bottom: 0; width: 100%; max-width: 450px; background: white; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="app">
    <div class="f-clock" id="live-clock">00:00:00</div>

    <div class="top-nav">
        <div class="user-info">👤 BOSS BET STUDIO</div>
        <div class="top-icons">
            <button class="icon-btn" onclick="location.reload()">🏠</button>
            <button class="icon-btn">📜</button>
            <button class="icon-btn">⚙️</button>
        </div>
    </div>

    <div class="tabs">
        <button id="tab-av" class="tab active-av" onclick="switchMode('aviator')">✈️ AVIATOR</button>
        <button id="tab-co" class="tab" onclick="switchMode('cosmos')">🚀 COSMOS X</button>
    </div>

    <div class="container">
        <div id="input-aviator" class="card">
            <h2 style="color:var(--aviator); margin-top:0">AVIATOR INPUT</h2>
            <div class="field">
                <span class="label">🕒 Heure du départ</span>
                <div class="input-group">
                    <input type="number" id="av-h" placeholder="00" oninput="limit(this,2)">
                    <span class="sep">:</span>
                    <input type="number" id="av-m" placeholder="00" oninput="limit(this,2)">
                </div>
            </div>
            <div class="field">
                <span class="label">🎯 Multiplicateur Cible</span>
                <div class="input-group"><input type="number" id="av-c" placeholder="2.00"></div>
            </div>
            <button class="btn-calc" style="background:var(--aviator)" onclick="calc('aviator')">Calculer Analytics</button>
        </div>

        <div id="input-cosmos" class="card" style="display:none">
            <h2 style="color:var(--cosmos); margin-top:0">COSMOSX INPUT</h2>
            <div class="field">
                <span class="label">🎰 Numéro du Tour (6 chiffres)</span>
                <div class="input-group"><input type="number" id="co-tr" placeholder="063291" oninput="limit(this,6)"></div>
            </div>
            <div class="field">
                <span class="label">🕒 Heure Exacte (HH:MM:SS)</span>
                <div class="input-group">
                    <input type="number" id="co-h" placeholder="00" oninput="limit(this,2)">
                    <span class="sep">:</span>
                    <input type="number" id="co-m" placeholder="00" oninput="limit(this,2)">
                    <span class="sep">:</span>
                    <input type="number" id="co-s" placeholder="00" oninput="limit(this,2)">
                </div>
            </div>
            <button class="btn-calc" style="background:var(--cosmos)" onclick="calc('cosmos')">Prédiction Cosmos X</button>
        </div>

        <div id="res-area" class="res-box"></div>
    </div>

    <nav>
        <button class="icon-btn" onclick="location.reload()">🏠</button>
        <button class="icon-btn">🎯</button>
        <button class="icon-btn">📜</button>
    </nav>
</div>

<script>
    let mode = 'aviator';

    setInterval(() => {
        document.getElementById('live-clock').innerText = new Date().toTimeString().split(' ')[0];
    }, 1000);

    function limit(el, max) { if(el.value.length > max) el.value = el.value.slice(0,max); }

    function switchMode(m) {
        mode = m;
        document.getElementById('input-aviator').style.display = m === 'aviator' ? 'block' : 'none';
        document.getElementById('input-cosmos').style.display = m === 'cosmos' ? 'block' : 'none';
        document.getElementById('tab-av').className = m === 'aviator' ? 'tab active-av' : 'tab';
        document.getElementById('tab-co').className = m === 'cosmos' ? 'tab active-co' : 'tab';
        document.getElementById('res-area').style.display = 'none';
    }

    function calc(type) {
        const area = document.getElementById('res-area');
        area.innerHTML = "";
        area.style.display = 'block';

        for(let i=0; i<2; i++) {
            const r = Math.random();
            const d = new Date();
            d.setMinutes(d.getMinutes() + (i * 3) + 2);
            const timeStr = d.getHours().toString().padStart(2,'0')+":"+d.getMinutes().toString().padStart(2,'0')+":"+Math.floor(r*60).toString().padStart(2,'0');
            
            let tourHTML = "";
            if(type === 'cosmos') {
                const tr = parseInt(document.getElementById('co-tr').value) || 63300;
                tourHTML = `<div class="tour-line"><div class="tour-badge">🎰 ${tr + (i*2) + 1}</div><div class="tour-badge">🎰 ${tr + (i*2) + 2}</div></div>`;
            }

            area.innerHTML += `
                <div class="res-item" style="border-left-color: ${type==='aviator'?'#d32f2f':'#f39c12'}">
                    <b style="color:${r>0.3?'#27ae60':'#d32f2f'}">${r>0.3?'TOUR TSARA ✅':'TOUR RATSY ⚠️'}</b>
                    <span style="display:block; font-size:0.7rem; color:#999; margin-top:5px;">🕒 HEURE PRÉDITE</span>
                    <span class="res-time">${timeStr}</span>
                    ${tourHTML}
                    <div class="gain-row">
                        <div class="gain-card"><span>Petit Gain</span><b style="color:#27ae60">x${(1.5 + r*2).toFixed(2)}</b></div>
                        <div class="gain-card"><span>Gros Gain</span><b style="color:#d32f2f">x${(10 + r*40).toFixed(2)}</b></div>
                    </div>
                </div>`;
        }
    }
</script>
</body>
</html>
