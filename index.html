<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandroka Vola - LOGIC TIME V47</title>
    <style>
        :root { --bg: #f8f9fa; --card: #ffffff; --text: #333; --input-bg: #e9ecef; --aviator: #d32f2f; --cosmos: #f39c12; --green: #28a745; --border: #dee2e6; }
        body.dark-mode { --bg: #121212; --card: #1e1e1e; --text: #ffffff; --input-bg: #2d2d2d; --border: #333; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; transition: 0.3s; padding-bottom: 80px; }
        .app { width: 100%; max-width: 450px; min-height: 100vh; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: var(--card); border-bottom: 1px solid var(--border); }
        .n-btn { background: var(--input-bg); border: none; padding: 8px; border-radius: 50%; cursor: pointer; color: var(--text); width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; }
        .tabs { display: flex; padding: 10px 15px; gap: 10px; }
        .tab { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 900; cursor: pointer; background: var(--input-bg); color: #777; }
        .tab.active-av { background: var(--card); border: 1px solid var(--border); color: var(--aviator); }
        .tab.active-co { background: var(--cosmos); color: white; }
        .container { padding: 15px; }
        .studio-card { background: var(--card); border-radius: 20px; padding: 25px; border: 1px solid var(--border); margin-bottom: 20px; text-align: center; }
        .f-label { display: block; text-align: center; font-size: 0.75rem; font-weight: 800; color: #888; margin-bottom: 8px; text-transform: uppercase; }
        .f-input-wrap { background: var(--input-bg); border-radius: 15px; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border); }
        .f-input { width: 100%; border: none; background: transparent; font-size: 1.3rem; font-family: monospace; text-align: center; outline: none; font-weight: bold; color: var(--green); }
        .btn-calc { width: 100%; padding: 18px; border-radius: 15px; border: none; color: white; font-weight: 900; font-size: 1.1rem; cursor: pointer; text-transform: uppercase; background: linear-gradient(90deg, #b71c1c, #2e7d32); }
        .res-box { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid var(--border); display: none; margin-top: 10px; text-align: center; }
        .res-list { list-style: none; padding: 0; margin: 10px 0; }
        .res-list li { font-size: 1.6rem; font-weight: 900; color: var(--green); font-family: monospace; margin-bottom: 5px; }
        .gain-row { display: flex; justify-content: space-between; align-items: center; background: #eeeeee; padding: 12px 15px; border-radius: 12px; margin-bottom: 8px; font-size: 0.8rem; font-weight: bold; }
        body.dark-mode .gain-row { background: #2d2d2d; }
        .f-clock { position: fixed; top: 110px; left: 15px; background: rgba(255,255,255,0.9); border: 1px solid #ddd; padding: 6px 12px; border-radius: 8px; font-family: monospace; font-weight: bold; z-index: 1000; }
        .hist-card { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border); position: relative; }
        .trash-btn { position: absolute; right: 15px; top: 15px; cursor: pointer; border: none; background: none; font-size: 1.2rem; }
        nav { position: fixed; bottom: 0; width: 100%; max-width: 450px; background: var(--card); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid var(--border); }
        .page { display: none; } .active-page { display: block; }
    </style>
</head>
<body id="main-body">

<div class="app">
    <div class="f-clock" id="live-clock">00:00:00</div>
    <div class="header">
        <div style="font-weight:bold; color:#555;">👤 VITANA TSARA</div>
        <div class="nav-icons">
            <button class="n-btn" onclick="document.getElementById('main-body').classList.toggle('dark-mode')">🌙</button>
            <button class="n-btn" onclick="showPage('home')">🏠</button>
            <button class="n-btn" onclick="showPage('hist')">📜</button>
        </div>
    </div>

    <div id="home-page" class="page active-page">
        <div class="tabs">
            <button id="tab-av" class="tab active-av" onclick="switchMode('aviator')">✈️ AVIATOR</button>
            <button id="tab-co" class="tab" onclick="switchMode('cosmos')">🚀 COSMOS X</button>
        </div>

        <div class="container">
            <div id="form-aviator" class="studio-card">
                <label class="f-label">🕒 HEURE DU DÉPART</label>
                <div class="f-input-wrap"><input type="text" id="av-h-in" class="f-input" placeholder="18:20:00"></div>
                <label class="f-label">🎯 MULTIPLICATEUR CIBLE</label>
                <div class="f-input-wrap"><input type="number" id="av-c-in" class="f-input" value="11.76"></div>
                <button class="btn-calc" onclick="calculate('av')">🔮 CALCULER V1.0.1</button>
            </div>

            <div id="form-cosmos" class="studio-card" style="display:none">
                <label class="f-label">🎰 DERNIERS CHIFFRES DU TOUR</label>
                <div class="f-input-wrap"><input type="number" id="co-tr-in" class="f-input" placeholder="262"></div>
                <label class="f-label">🕒 HEURE EXACTE</label>
                <div class="f-input-wrap"><input type="text" id="co-h-in" class="f-input" placeholder="22:48:00"></div>
                <label class="f-label">🎯 MULTIPLICATEUR (+2.00)</label>
                <div class="f-input-wrap"><input type="number" id="co-c-in" class="f-input" value="2.80"></div>
                <button class="btn-calc" onclick="calculate('co')">🚀 PRÉDICTION COSMOS X</button>
            </div>

            <div id="res-box" class="res-box">
                <span class="f-label">🖐️ HEURES PRÉDITES</span>
                <ul class="res-list">
                    <li><b id="h1" style="color:var(--green)">--:--:--</b></li>
                    <li><b id="h2" style="color:var(--green)">--:--:--</b></li>
                    <li><b id="h3" style="color:var(--green)">--:--:--</b></li>
                </ul>
                <div id="tours-section" style="display:none">
                    <span class="f-label">🎰 TOURS PRÉDITS</span>
                    <div class="tours-container">
                        <div class="tour-item" id="t1">---</div>
                        <div class="tour-item" id="t2">---</div>
                        <div class="tour-item" id="t3">---</div>
                    </div>
                </div>
                <div class="gain-row"><span>👑 SÉCURITÉ</span><span id="g1" style="color:var(--green); font-family:monospace;">x0.00</span></div>
                <div class="gain-row"><span>💸 TENTENA</span><span id="g2" style="color:var(--green); font-family:monospace;">x0.00</span></div>
                <div class="gain-row"><span>💰 GAIN</span><span id="g3" style="color:var(--green); font-family:monospace;">x0.00</span></div>
            </div>
        </div>
    </div>

    <div id="hist-page" class="page"><div class="container" id="hist-list"></div></div>
    <nav><button class="n-btn" onclick="showPage('home')">🏠</button><button class="n-btn" onclick="showPage('hist')">📜</button></nav>
</div>

<script>
    let historyData = [];
    const getTime24h = (d) => d.toLocaleTimeString('fr-FR', {hour12: false});
    setInterval(() => { document.getElementById('live-clock').innerText = getTime24h(new Date()); }, 1000);

    function showPage(p) {
        document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active-page'));
        document.getElementById(p + '-page').classList.add('active-page');
        if(p === 'hist') renderHistory();
    }

    function switchMode(m) {
        document.getElementById('form-aviator').style.display = m === 'aviator' ? 'block' : 'none';
        document.getElementById('form-cosmos').style.display = m === 'cosmos' ? 'block' : 'none';
        document.getElementById('tab-av').className = m === 'aviator' ? 'tab active-av' : 'tab';
        document.getElementById('tab-co').className = m === 'cosmos' ? 'tab active-co' : 'tab';
        document.getElementById('res-box').style.display = 'none';
    }

    function calculate(type) {
        const hIn = type === 'av' ? document.getElementById('av-h-in').value : document.getElementById('co-h-in').value;
        const target = parseFloat(type === 'av' ? document.getElementById('av-c-in').value : document.getElementById('co-c-in').value) || 2.0;
        const trBase = parseInt(document.getElementById('co-tr-in').value) || 0;
        
        const baseDate = new Date();
        if(hIn) {
            const pts = hIn.split(':');
            baseDate.setHours(parseInt(pts[0]), parseInt(pts[1]), parseInt(pts[2] || 0));
        }

        // ALGORITHM LERA (Intervalle voahitsy: 1min, 3min, 4min)
        const d1 = new Date(baseDate.getTime() + (60000) + (Math.random() * 60000));
        const d2 = new Date(d1.getTime() + (120000) + (Math.random() * 120000));
        const d3 = new Date(d2.getTime() + (180000) + (Math.random() * 120000));

        const h1 = getTime24h(d1), h2 = getTime24h(d2), h3 = getTime24h(d3);
        document.getElementById('h1').innerText = h1;
        document.getElementById('h2').innerText = h2;
        document.getElementById('h3').innerText = h3;

        // ALGORITHM CÔTE
        const sVal = 1.05 + (Math.random() * 4.15);
        const g1 = sVal.toFixed(2);
        const tVal = sVal + (target * 0.4) + (Math.random() * 1.5);
        const g2 = tVal.toFixed(2);
        const g3 = (tVal + 45 + (Math.random() * 140)).toFixed(2);

        document.getElementById('g1').innerText = "x" + g1;
        document.getElementById('g2').innerText = "x" + g2;
        document.getElementById('g3').innerText = "x" + g3;

        let tours = [];
        if(type === 'co') {
            document.getElementById('tours-section').style.display = 'block';
            tours = [trBase + 5, trBase + 11, trBase + 23];
            document.getElementById('t1').innerText = tours[0];
            document.getElementById('t2').innerText = tours[1];
            document.getElementById('t3').innerText = tours[2];
        } else {
            document.getElementById('tours-section').style.display = 'none';
        }

        document.getElementById('res-box').style.display = 'block';
        historyData.unshift({ type, h1, g1, g2, g3, tours, time: getTime24h(new Date()) });
        if(window.navigator.vibrate) window.navigator.vibrate(100);
    }

    function renderHistory() {
        const list = document.getElementById('hist-list');
        list.innerHTML = historyData.length ? historyData.map((h, i) => `
            <div class="hist-card">
                <button class="trash-btn" onclick="deleteHist(${i})">🗑️</button>
                <div style="font-weight:bold; color:#888; font-size:0.7rem;">${h.type === 'av' ? '✈️ AVIATOR' : '🚀 COSMOS'} - ${h.time}</div>
                <div style="font-size:1.2rem; font-weight:bold; color:var(--green); font-family:monospace;">${h.h1}</div>
                <div style="display:flex; gap:10px; margin-top:5px; font-weight:bold; font-family:monospace; font-size:0.85rem;">
                    <span style="color:var(--cosmos)">S: x${h.g1}</span> <span style="color:var(--green)">T: x${h.g2}</span> <span style="color:var(--aviator)">G: x${h.g3}</span>
                </div>
            </div>
        `).join('') : "Tsy misy tantara.";
    }
    function deleteHist(i) { historyData.splice(i, 1); renderHistory(); }
</script>
</body>
</html>
